{% extends 'includes/base.html' %}
{% block title %}HexChess | Home Page{% endblock %}

{% block content %}
<div class="card">
    <h2>Welcome to my home page!</h2>
    <form method="POST" action="{% url 'game:index_page' %}">
        {% csrf_token %}
        <button type=submit>Go to game page</button>
    </form>

    <button type=button>
        <a href="{% url 'login' %}" class="button_url">Login</a>
    </button>
</div>
{% endblock %}
