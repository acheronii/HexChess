{% extends 'includes/base.html' %}
{% block title %}Signup Page{% endblock %}

{% block content %}
<div class="card">

<h2>Sign Up</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Sign up</button>
</form>

<form method="POST" action="{% url 'login' %}">
    {% csrf_token %}
    <button type="submit">
    Already have an account?
    </button>
</form>

</div>
{% endblock %}
