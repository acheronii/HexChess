{% extends 'includes/base.html' %}
{% block title %}HexChess | Login Page{% endblock %}

{% block content %}

<div class="card">

<h2>Login</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Login</button>
</form>
Don't have an account? 
<button class="button">
    <a href="{% url 'accounts:signup' %}">Sign up</a>
</button>

</div>

{% endblock %}
