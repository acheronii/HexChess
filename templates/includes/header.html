<header style="background-color: #007ACC; padding: 1rem; color: white; display: flex; justify-content: space-between; align-items: center;">
  <a href="{% url 'home:home' %}" style="color: white; font-weight: bold; font-size: 1.25rem; text-decoration: none;">HexChess</a>
  <nav>
    <a href="{% url 'home:home' %}" style="color: white; margin-right: 1rem; text-decoration: none;">Home</a>
    {% if user.username %}
        <a href="{% url 'accounts:profile' %}" style="color: white; margin-right: 1rem; text-decoration: none;">Account</a>
        <form method="POST" action="{% url 'logout' %}" style="display: inline;">
            {% csrf_token %}
            <button type="submit" style="background: none; border: none; color: white; text-decoration: underline; cursor: pointer;">
                Logout
            </button>
        </form>
    {% else %}
        <a href="{% url 'login' %}" style="color: white; text-decoration: none;">Login</a>
    {% endif %}
  </nav>
</header>
