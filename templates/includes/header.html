<header>
  <h1><a href="{% url 'home:home' %}" class="brand">HexChess</a></h1>
  <nav>
    <a href="{% url 'home:home' %}">Home</a>
    {% if user.username %}
        <a href="{% url 'accounts:profile' %}">Account</a>
        <form method="POST" action="{% url 'logout' %}" style="display:inline;">
            {% csrf_token %}
            <button type="submit">
            Logout
            </button>
        </form>
    {% else %}
        <a href="{% url 'login' %}">Login</a>
    {% endif %}
  </nav>
</header>
